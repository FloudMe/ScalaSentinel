twitter {
  api-url = "https://api.twitter.com/2/tweets/search/recent"
  timeout = 30s
}

collector {
  default {
    interval = 10 seconds
    max-results = 50
    enabled = true
    priority = 3
  }

  tags = [
    {
      name = "scala"
      interval = 5 seconds
      max-results = 100
      priority = 1
    },
    {
      name = "akka",
      interval = 15 seconds,
      enabled = false
    },
    {
      name = "spark",
      max-results = 30
    }
  ]
}